<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>مدير المصنع - Factory Manager V4</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="stylesheet" href="./css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <div id="sb-overlay"></div>
  <aside id="sb"></aside>
  <div id="cn">
    <div id="top">
      <button id="bg" aria-label="القائمة">☰</button>
      <button onclick="bkw(-1)" title="رجوع">▶</button>
      <button onclick="bkw(1)" title="تقدم">◀</button>
      <h1 id="ttl"></h1>
      <span id="net" onclick="syncPage()" style="cursor:pointer"></span>
      <select id="who" onchange="swho(this.value)"></select>
      <select id="thb" onchange="togTheme(this.value)"><option value="">🎨</option><option value="light">فاتح</option><option value="dark">داكن</option><option value="auto">تلقائي</option></select>
      <button id="lgb" onclick="togLang()">🌐</button>
    </div>
    <div id="tabs"></div>
    <main id="m"></main>
  </div>
</div>
<div id="toast"></div>
<div id="pr" style="display:none"></div>
<script src="./js/app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
document.addEventListener('touchstart', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
let lastTouch=0;
document.addEventListener('touchend', e=>{ const now=Date.now(); if(now-lastTouch<=300) e.preventDefault(); lastTouch=now; }, {passive:false});
</script>
</body>
</html>
